// Top-level build file where you can add configuration options common to all sub-projects/modules.

// CHANGED: apply plugin -> plugins {} block (modern style)
// CHANGED: ben-manes versions plugin bumped to current

buildscript {
    repositories {
        mavenCentral()
        // CHANGED: jcenter() removed — it is sunset and packages are disappearing
        google()
    }
    dependencies {
        // CHANGED: AGP 4.1.2 -> 8.4.2 (major jump; see migration notes below)
        classpath 'com.android.tools.build:gradle:8.4.2'

        // CHANGED: Kotlin plugin version should match Dependencies.kt — bump to 2.0.x there
        // Cannot reference buildSrc "Dependencies" here — Gradle shadows it with its own Dependencies type
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"

        // CHANGED: Hilt plugin — ensure Dependencies.kt has hiltPlugin = "2.51.1"
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.51.1'

        // CHANGED: ben-manes moved into plugins {} block above; no longer needed here
        // classpath 'com.github.ben-manes:gradle-versions-plugin:0.36.0'  <-- removed

        // CHANGED: Jetifier removed — it was only needed for legacy Support Library -> AndroidX
        // migration. If any dependency still needs it, add android.enableJetifier=true to
        // gradle.properties instead of carrying the processor classpath here.
        // classpath 'com.android.tools.build.jetifier:jetifier-processor:1.0.0-beta10'  <-- removed



        // ADDED: KSP plugin — required to replace kapt in app/build.gradle and submodules
        // Version must match your Kotlin version exactly (Kotlin 2.0.x -> KSP 2.0.x-1.0.xx)
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.0.21-1.0.28'
    }
}

plugins {
    id 'com.github.ben-manes.versions' version '0.51.0' apply true
}

// Dependency update filtering — reject pre-release upgrades from stable versions
static def isNonStable(String v) {
    ["-alpha", "-beta", "-rc", "-m", "-preview"].any { v.toLowerCase().contains(it) }
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version) && !isNonStable(it.currentVersion)
    }
}

// CHANGED: allprojects repositories block — jcenter() removed
// jitpack stays in app/build.gradle where it's actually needed, not globally
allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

// CHANGED: task clean -> tasks.register (AGP 8.x deprecates the old task {} syntax)
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
