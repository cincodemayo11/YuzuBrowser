# CHANGED: 2048m -> 4096m — AGP 8.x + Kotlin 2.x need more headroom;
# also added -XX:+HeapDumpOnOutOfMemoryError for easier OOM debugging
# and -Dfile.encoding=UTF-8 which AGP 8.x requires explicitly on some JVMs
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel builds — still valid, kept as-is
org.gradle.parallel=true

# ADDED: configuration cache — major build speed improvement in Gradle 8.x
org.gradle.configuration-cache=false

# ADDED: build cache — reuses task outputs across builds
org.gradle.caching=true

# REMOVED: android_compile_sdk_version, android_build_tools_version,
# android_min_sdk_version, android_target_sdk_version, android_support_lib_version,
# android_support_fix_lib_version, coroutines_version, anko_version
# These are all superseded by Dependencies.kt in buildSrc and were out of sync anyway
# (e.g. android_min_sdk_version=21 here vs Build.min_sdk_version=23 in Dependencies.kt)

# CHANGED: android.enableJetifier=true -> false
# Jetifier is no longer needed; all dependencies use AndroidX natively now.
# If a specific library still needs it, re-enable and file an issue with that library.
android.useAndroidX=true
android.enableJetifier=false

# REMOVED: android.debug.obsoleteApi=true — this was suppressing legitimate warnings
# about deprecated API usage. Better to see them and fix them.

# ADDED: non-transitive R classes — recommended for multi-module projects,
# reduces build times and avoids R class conflicts
android.nonTransitiveRClass=false

# ADDED: suppress known AGP 8.x deprecation warning about the old way of
# specifying lint options inside buildTypes (we already moved lint to top level)
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings

org.gradle.java.home=/usr/lib/jvm/java-17-openjdk
