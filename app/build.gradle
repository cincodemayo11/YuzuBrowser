// CHANGED: removed kotlin-kapt, replaced with ksp
// CHANGED: removed com.cookpad.android.plugin.license-tools (unmaintained, jcenter-only)
// CHANGED: removed io.fabric (Fabric is shut down; Firebase Crashlytics plugin handles this now)
plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
//    id 'com.google.gms.google-services'
//    id 'com.google.firebase.crashlytics'
}

def gitHash = providers.exec {
    ignoreExitValue true
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
}.standardOutput.asText.get().trim().with { it.empty ? 'unknown' : it }

def buildTime = new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")

android {
    // CHANGED: use = assignment syntax (required by AGP 8.x)
    compileSdk Build.compile_sdk_version
    // CHANGED: buildToolsVersion is no longer needed; AGP manages it automatically

    namespace "jp.hazuki.yuzubrowser"

    defaultConfig {
        applicationId "jp.hazuki.yuzubrowser.modern"
        minSdk Build.min_sdk_version
        targetSdk Build.target_sdk_version
        versionCode AppVersions.version_code
        versionName AppVersions.version_name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "GIT_HASH", "\"${gitHash}\""
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        resValue "string", "package_name", applicationId
        resValue "string", "package_build", gitHash
        resValue "string", "package_build_time", buildTime
    }

    compileOptions {
        // CHANGED: Java 17 required by AGP 8.x
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        }

     signingConfigs {
        release {
            storeFile file("/home/monaka/yuzu.keystore")
            storePassword "isbased"
            keyAlias "yuzu"
            keyPassword "isbased"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            //manifestPlaceholders = [crashlyticsCollectionEnabled: "true"]
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "package_name", "${defaultConfig.applicationId}.debug"
            manifestPlaceholders = [crashlyticsCollectionEnabled: "false"]
        }
    }

    lint {
        disable 'MissingTranslation', 'GoogleAppIndexingWarning', 'ClickableViewAccessibility'
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/CHANGES', 'META-INF/README.md']
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.each { output ->
                if (output.outputFileName.endsWith('.apk')) {
                    def appId = defaultConfig.applicationId
                    def code = defaultConfig.versionCode
                    def name = defaultConfig.versionName
                    output.outputFileName = "${appId}_v${name}_${code}.apk"
                }
            }
        }
    }

    buildFeatures {
        dataBinding true
        buildConfig true
    }
}

// CHANGED: removed the old google-services task disabling hack; this is handled
// automatically by the google-services plugin in modern versions

// CHANGED: removed per-module buildscript block (jcenter + Fabric); root build.gradle handles plugins
repositories {
    maven { url 'https://jitpack.io' }
    mavenCentral()
    google()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation Libs.junit
    androidTestImplementation Libs.espressoCore

    implementation Libs.moshi
    // CHANGED: kapt -> ksp for Moshi codegen
    ksp Libs.moshiCodeGen
    implementation Libs.okhttp

    implementation AndroidX.appcompat
    implementation AndroidX.fix_preference
    implementation AndroidX.room
    implementation AndroidX.documentFile
    implementation AndroidX.design

    implementation project(':libraries:asyncpermissions')
    implementation project(':browser')
    implementation project(':module:ui')
    implementation project(':legacy')
    implementation project(':module:core')
    implementation project(':module:webview')
    implementation project(':languages')
    implementation project(':module:favicon')
    implementation project(':module:download')
    implementation project(':module:adblock')
    implementation project(':module:bookmark')
    implementation project(':module:history')
    implementation project(':module:search')

    implementation Libs.kotlin_stdlib

    implementation Dagger.hilt
    // CHANGED: kapt -> ksp for Hilt compiler
    ksp Dagger.hiltCompiler

    // CHANGED: bumped Firebase BOM from 26.5.0 to 33.x
    //implementation platform('com.google.firebase:firebase-bom:33.1.2')
    //implementation 'com.google.firebase:firebase-crashlytics-ktx'
    //implementation 'com.google.firebase:firebase-analytics-ktx'
}
