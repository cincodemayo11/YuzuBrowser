// CHANGED: apply plugin -> plugins {} block
// CHANGED: kotlin-kapt -> ksp
plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
}

android {
    // CHANGED: compileSdk -> compileSdk (AGP 8.x)
    compileSdk Build.compile_sdk_version

    // ADDED: namespace required by AGP 8.x (replaces package in AndroidManifest)
    namespace "jp.hazuki.yuzubrowser.browser"

    defaultConfig {
        // CHANGED: minSdkVersion/targetSdk -> minSdk/targetSdk (AGP 8.x)
        minSdk Build.min_sdk_version
        targetSdk Build.target_sdk_version
        // CHANGED: versionCode/versionName removed — not meaningful in a library module
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        // CHANGED: VERSION_17 -> VERSION_17 (required by AGP 8.x)
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        // ADDED: was missing from original; must match compileOptions
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        dataBinding true
    }
}

// REMOVED: repositories {} block — now centralized in settings.gradle
// dependencyResolutionManagement handles jitpack globally

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    testImplementation Libs.junit
    androidTestImplementation Libs.espressoCore
    androidTestImplementation Libs.androidRunner

    implementation AndroidX.appcompat
    implementation AndroidX.design
    implementation AndroidX.recyclerView
    implementation AndroidX.constraintLayout
    implementation AndroidX.fix_preference
    implementation AndroidX.room
    implementation AndroidX.print
    implementation AndroidX.documentFile
    implementation AndroidX.webkit
    implementation AndroidX.swipeRefreshLayout

    implementation Libs.okhttp
    implementation Libs.okio
    implementation Libs.moshi
    // CHANGED: kapt -> ksp
    ksp Libs.moshiCodeGen

    implementation 'com.github.turing-tech:MaterialScrollBar:13.3.4'

    implementation project(':libraries:asyncpermissions')
    implementation project(':module:ui')
    implementation project(':legacy')
    implementation project(':module:core')
    implementation project(':module:webview')
    implementation project(':languages')
    implementation project(':module:favicon')
    implementation project(':module:download')
    implementation project(':module:adblock')
    implementation project(':module:bookmark')
    implementation project(':module:connecter')
    implementation project(':module:history')
    implementation project(':module:search')

    implementation Libs.kotlin_stdlib
    implementation Libs.kotlin_coroutines
    implementation Libs.kotlin_coroutines_android

    implementation Dagger.hilt
    // CHANGED: kapt -> ksp
    ksp Dagger.hiltCompiler
}
